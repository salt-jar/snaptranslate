name: Build & Release

# 推送 v* 标签时自动打包并发布 Release；
# 也可以在 Actions 页面手动触发（workflow_dispatch）只产出构建产物。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建 Windows 免安装版
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 语法检查
        run: python -m compileall -q app main.py tools

      - name: 依赖导入自检
        run: python tools/selftest.py --deps

      - name: 打包（PyInstaller）
        run: pyinstaller shotranslate.spec --noconfirm

      - name: 压缩产物
        shell: pwsh
        run: |
          Compress-Archive -Path dist/SnapTranslate/* -DestinationPath SnapTranslate-win64.zip -Force
          Get-Item SnapTranslate-win64.zip | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: SnapTranslate-win64
          path: SnapTranslate-win64.zip
          retention-days: 30

      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SnapTranslate-win64.zip
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          generate_release_notes: false
